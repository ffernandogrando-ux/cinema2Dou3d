      const fs = new Set(fams.map(f => f.replace(/^['"]|['"]$/g, '')));
      fs.forEach(f => { if (!['Poppins', 'Caveat', 'monospace', 'Shippori Mincho B1', 'Playfair Display', 'Baloo 2', 'VT323'].includes(f)) out.push({ ...base, tipo: 'fonte não carregada: ' + f }); }); }
    // texto de documento ou placa debaixo da legenda (faixa de ~78 % a 87 % da altura, no meio do quadro)
    if (!pl.semTexto && document.getElementById('sub').innerHTML) (window._textosT || []).forEach(m => { if (m.y1 > 800 && m.y0 < 890 && m.x1 > 120 && m.x0 < 456) out.push({ ...base, tipo: 'texto sob a legenda: ' + m.nome }); }); }
  return out; };
// lista de efeitos sonoros com tempo absoluto: {t, som, v}
function ambDe(pl) { // ambiente do plano: AMBIENTE = { 'linha' ou 'linha:palavra': ['nome', volume] | null }
  if (pl.amb !== undefined) return pl.amb; if (typeof AMBIENTE === 'undefined') return null;
  let best = null, bk = -1; const me = pl.l * 1000 + (pl.w || 0);
  for (const k in AMBIENTE) { const [l, w] = k.split(':').map(Number), kk = l * 1000 + (w || 0); if (kk <= me && kk > bk) { bk = kk; best = AMBIENTE[k]; } }
  return best;
}
window.SONS = () => { const out = [], amb = [];
  PLANOS.forEach((pl, i) => {
    const a = ambDe(pl), last = amb[amb.length - 1];
    if (a) { if (last && last.som === a[0] && Math.abs(last.fim - pl.ini) < .01) last.fim = pl.fim; else amb.push({ ini: pl.ini, fim: pl.fim, som: a[0], v: a[1] }); }
    if (pl.passos && !pl.sub) { const r = pl.passos.r || 2.2; let k = 0; for (let t = pl.base + (pl.passos.d || .1); t < pl.base + pl.dTot - .05; t += 1 / r) out.push({ t, som: k++ % 2 ? 'passo2' : 'passo1', v: pl.passos.v ?? .3 }); }
    if (pl.wh) out.push({ t: Math.max(0, pl.ini - 0.12), som: 'whoosh', v: (pl.wh === true ? .35 : pl.wh) * .6 });
    // (sem whoosh automático nos cortes: soava como chiado constante)
    (pl.sfx || []).forEach(x => { const t = x.w != null ? PALAVRAS[LINHAS[x.l ?? pl.l][x.w]].s + (x.o || 0) : pl.ini + (x.t || 0); out.push({ t, som: x.s, v: x.v ?? .7 }); });
  });
  if (typeof PERGUNTA !== 'undefined') out.push({ t: PALAVRAS[LINHAS[PERGUNTA.l][0]].s, som: 'pergunta', v: .6 });
  return { cues: out.sort((a, b) => a.t - b.t), amb }; };
