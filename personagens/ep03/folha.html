<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=block" rel="stylesheet">
<style>body{margin:0;background:#111}svg{display:block}</style></head><body>
<svg id="s" width="1728" height="1024" viewBox="0 0 1728 1024"></svg>
<script src="../../motor/stick.js"></script>
<script>
const t=1.1;
const nome=(x,txt,sub)=>`<text x="${x}" y="960" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="34" fill="#1d1f2b">${txt}</text><text x="${x}" y="996" text-anchor="middle" font-family="Poppins" font-weight="600" font-size="22" fill="#55586a">${sub}</text>`;
// painel 1: os três, fundo neutro com luz
let a=`<defs>${STK_DEFS}<radialGradient id="luz" cx=".35" cy=".25" r=".9"><stop offset="0" stop-color="#FFF6E4"/><stop offset="1" stop-color="#E6DCCB"/></radialGradient>
<radialGradient id="vin" cx=".5" cy=".45" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#2a1a10" stop-opacity=".35"/></radialGradient>
<filter id="bg"><feGaussianBlur stdDeviation="7"/></filter>
<radialGradient id="sol" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD58A" stop-opacity=".85"/><stop offset="1" stop-color="#FFB347" stop-opacity="0"/></radialGradient></defs>`;
a+=`<rect width="1152" height="1024" fill="url(#luz)"/><rect y="870" width="1152" height="154" fill="#D9CDB8"/>`;
a+=stick(AURELIO,{x:200,y:870,s:1.05,t,pose:{bE:[10,-8],bD:[30,-70]},boca:'sorriso',sobrancelha:'bravo',olhar:.25});
a+=stick(SOCORRO,{x:560,y:870,s:1.05,t,ph:1,pose:{bE:[25,-40],bD:[22,-40]},boca:'sorriso'});
a+=stick(NINA,{x:880,y:870,s:1.15,t,ph:2,pose:{bE:[150,-20],bD:[14,-10]},boca:'riso',olhar:-.1});
a+=nome(200,'seu Aurélio','dono das nuvens')+nome(560,'dona Socorro','lavadeira')+nome(880,'Nina','a filha');
a+=`<rect width="1152" height="1024" fill="url(#vin)"/>`;
// painel 2: cena com luz e desfoque (quintal da Baixada, vapor)
let b=`<g transform="translate(1152 0)"><clipPath id="c2"><rect width="576" height="1024"/></clipPath><g clip-path="url(#c2)">
<rect width="576" height="1024" fill="#F3B97A"/>
<g filter="url(#bg)" opacity=".95"><rect x="-20" y="380" width="620" height="400" fill="#C98B5A"/>
${[[20,300,140,'#E2A86F'],[180,260,150,'#D9895E'],[350,310,120,'#E7B585'],[470,280,140,'#CF7F55']].map(([x,y,w,c])=>`<rect x="${x}" y="${y}" width="${w}" height="${520-y+200}" fill="${c}"/><rect x="${x+30}" y="${y+40}" width="40" height="50" fill="#6b4a3a"/>`).join('')}
<path d="M0 520 Q150 500 300 515 T576 505" stroke="#fff" stroke-width="4" fill="none"/>
${[60,140,230,320,420,500].map((x,i)=>`<rect x="${x}" y="${510+(i%2)*6}" width="46" height="60" fill="${['#7DB7E8','#fff','#F49AB0','#FFD166','#A8DDB5','#fff'][i]}"/>`).join('')}</g>
<rect y="760" width="576" height="264" fill="#B9774B"/><rect y="760" width="576" height="6" fill="#8a5233"/>
<circle cx="420" cy="140" r="260" fill="url(#sol)"/>
<ellipse cx="370" cy="830" rx="120" ry="34" fill="#000" opacity=".18" filter="url(#stkBlur)"/>
<path d="M260 760 q0 60 110 60 q110 0 110 -60z" fill="#9AA6B2" stroke="#1d1f2b" stroke-width="6"/><ellipse cx="370" cy="760" rx="110" ry="26" fill="#BFE3F2" stroke="#1d1f2b" stroke-width="6"/>
${[0,1,2,3].map(i=>`<path d="M${330+i*25} 740 q-30 -90 10 -180 t-10 -220" stroke="#fff" stroke-width="${26-i*4}" fill="none" stroke-linecap="round" opacity=".7" filter="url(#bg)"/>`).join('')}
${stick(SOCORRO,{x:200,y:820,s:.95,t,pose:{bE:[40,-60],bD:[55,-50]},boca:'fala',olhar:.3})}
${stick(NINA,{x:480,y:880,s:.95,t,ph:2,pose:{bE:[160,10],bD:[12,-10]},boca:'o',olhar:-.25,cabeca:-12,olhos:'arregalados'})}
<rect width="576" height="1024" fill="url(#vin)"/>
<rect x="18" y="18" width="240" height="44" rx="22" fill="#1d1f2b" opacity=".75"/><text x="36" y="48" font-family="Poppins" font-weight="800" font-size="20" fill="#FFD58A">☁ NUVENS ▸ 100</text>
<text x="288" y="900" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="46" fill="#fff" stroke="#000" stroke-width="10" paint-order="stroke">VAPOR</text>
</g></g>`;
document.getElementById('s').innerHTML=a+b;window.PRONTO=1;
</script></body></html>
